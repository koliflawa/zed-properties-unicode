# Push a tag vX.Y.Z to publish a release with the language server script attached.
# The extension downloads properties-unicode-lsp.mjs from the latest release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$version\"" extension.toml
          grep -qx "version = \"$version\"" Cargo.toml
          grep -q "name: 'properties-unicode', version: '$version'" server/properties-unicode-lsp.mjs

      - name: Check the server script
        run: node --check server/properties-unicode-lsp.mjs

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" server/properties-unicode-lsp.mjs --title "$GITHUB_REF_NAME" --generate-notes
